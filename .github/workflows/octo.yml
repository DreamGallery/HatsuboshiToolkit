name: Octo protobuf compatibility
on:
  push:
    paths: ['src/**', 'proto/**', 'tests/test_octo_protobuf.py', 'requirements.txt', 'config.ini', '.github/workflows/octo.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test_octo_protobuf.py' -v
      - run: python main.py --help
